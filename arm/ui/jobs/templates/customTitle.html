{% extends "base.html" %}
{% block title %}Customize Title{% endblock %}

{% block nav %}{{ super() }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-9">
            <h2 class="h4 text-center mb-3">Customize title</h2>
            <p class="text-muted">Set a custom title for multi-disc TV releases or discs ARM could not identify.</p>
            <form action="" method="get" novalidate>
                <div class="form-row">
                    <div class="form-group col-12 col-md-8">
                        <label for="custom-title">Title</label>
                        <input id="custom-title" type="text" class="form-control" name="title" value="{{ suggested_title }}" required>
                    </div>
                    <div class="form-group col-12 col-md-4">
                        <label for="custom-year">Year</label>
                        <input id="custom-year" type="number" min="1800" max="2200" class="form-control" name="year" value="{{ suggested_year }}">
                    </div>
                </div>
                <input type="hidden" name="job_id" value="{{ job.job_id }}">
                {% include "disc_metadata_controls.html" %}
                <button class="btn btn-primary btn-lg btn-block" type="submit">Save title and episode mapping</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
